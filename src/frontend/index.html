<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wildlife Survey Counter</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token":"cc080d4072bf42a5a8a76b19d89f06c0"}'
    ></script>
    <script>
      (() => {
        var redirectedPath = new URLSearchParams(window.location.search).get('p')
        var redirectUrl
        if (!redirectedPath) return
        try {
          redirectUrl = new URL(redirectedPath, window.location.origin)
          window.history.replaceState({}, '', redirectUrl.pathname + redirectUrl.search + redirectUrl.hash)
        } catch {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
