name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check src/wildlife_counter/

      - name: Ruff format check
        run: uv run ruff format --check src/wildlife_counter/

      - name: Pyright
        run: uv run pyright

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Biome check
        run: npx --prefix src/frontend biome check src/frontend/

      - name: TypeScript typecheck
        working-directory: src/frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: src/frontend
        run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: wildlife-survey-counter:ci
          build-args: WITH_ML=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name wsc-ci -p 8100:8100 wildlife-survey-counter:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8100/api/health; then
              echo "image is serving /api/health"
              if curl -sf http://localhost:8100/ | grep -q '<div id="root"'; then
                echo "image is serving the frontend"
                exit 0
              fi
              echo "GET / did not return the built frontend"
              docker logs wsc-ci
              exit 1
            fi
            sleep 2
          done
          echo "server did not become healthy"
          docker logs wsc-ci
          exit 1

      - name: Tear down
        if: always()
        run: docker rm -f wsc-ci || true

      # The full ML image is multi-GB and is not built here; this validates the apt layer it
      # depends on (the part that broke in #2) without pulling any Python wheels.
      - name: Validate ML system-libs stage
        run: docker build --build-arg WITH_ML=true --target ml-system-libs -t wsc-ml-system-libs:ci .
